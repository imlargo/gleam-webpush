name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.x", "28.x", "29.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.18.1"
      - run: gleam deps download
      - run: gleam build
      - run: gleam test
      - run: gleam format --check src test
      - name: Build the examples against the local library
        working-directory: examples
        run: gleam build
